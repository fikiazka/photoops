# PhotoOps - konfigurasi Apache produksi (container Vercel). Dimuat lewat a2enconf photoops.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes -MultiViews
    # .htaccess tidak dibaca; semua aturan akses ada di berkas ini.
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>

# Folder kode internal: hanya di-include oleh PHP, tidak boleh dibuka lewat URL (berkas di dalamnya juga punya
# pengaman `defined('ROOT') || exit;`). Folder yang tidak disalin ke image ikut didaftarkan sebagai lapisan kedua.
<DirectoryMatch "^/var/www/html/(includes|data|partials|config|database|tests|docs|docker)(/|$)">
    Require all denied
</DirectoryMatch>

# Berkas tersembunyi, dokumentasi, SQL, konfigurasi, kunci/sertifikat, dan cadangan.
<FilesMatch "(^\.|\.(md|sql|ini|conf|log|bak|old|orig|swp|sh|dist|example|lock|crt|pem|key)$|~$|^(Dockerfile|vercel\.json)$)">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always unset X-Powered-By
</IfModule>
